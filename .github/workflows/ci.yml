name: repository-checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-offline.txt
      - run: python -m pytest App/tests -q
      - run: python offline_demo.py
      - name: Parse Python sources
        run: python -m compileall -q App run.py devices.py
      - uses: actions/upload-artifact@v4
        with:
          name: offline-review-trace
          path: results/offline
